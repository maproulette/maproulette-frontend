name: CI

on:
  push:
    branches: ['main']
  pull_request:

# Cancel superseded runs on the same PR or branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Categorize the kind of changes being made to decide what checks to run
  # (docs-only changes skip all checks; translation-only changes skip e2e tests).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      lang: ${{ steps.filter.outputs.lang }}

    steps:
      - name: Checkout repository
        if: github.event_name == 'push'
        uses: actions/checkout@v7

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!lang/**'
              - '!LICENSE'
              - '!transifex.yml'
              - '!.github/FUNDING.yml'
              - '!.github/ISSUE_TEMPLATE/**'
            lang:
              - 'lang/**'

  check:
    name: Lint, format, and typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.lang == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting, lint, typecheck, dead code, and i18n catalog
        run: npm run check

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.lang == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  test:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.lang == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm run test

  e2e:
    name: E2E tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Pre-pull backend images
        run: docker compose -f docker-compose.test.yaml pull

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          E2E_STUB_LISTEN_HOST: 0.0.0.0

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
