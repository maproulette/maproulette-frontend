# Test stack for E2E tests. Compatible with `docker compose` and `podman compose`.
# Started by Playwright's webServer (see playwright.config.ts) or manually:
#   docker compose -f docker-compose.test.yaml up
#   podman compose -f docker-compose.test.yaml up

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: maproulette
      POSTGRES_USER: maproulette
      POSTGRES_PASSWORD: hunter2
    # No fixed host port: the backend reaches this over the compose network via
    # the `db` hostname, and a fixed "5432:5432" mapping collides with any other
    # local Postgres already bound to that port on the host. Publish without a
    # host port so Docker picks a free one if you need to connect directly
    # (`docker compose -f docker-compose.test.yaml port db 5432`).
    ports:
      - "5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "maproulette", "-d", "maproulette"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    # Pinned to `main` rather than a version tag: the dashboard team-list name
    # display (teams.spec.ts) depends on the `teamName` field added to the
    # memberships API in backend commit 8b445ce0 (2026-08-05), which hasn't
    # made it into a versioned release yet (latest is 4.9.5, from 2026-07-16).
    # Switch back to a version tag once one is cut past that commit.
    # Overridable because a branch's backend work is not in the published image
    # until it is merged. To test against a local backend checkout, build it and
    # point this at the result:
    #   (cd ../maproulette-backend && docker build --platform linux/amd64 \
    #      -t maproulette-backend:local .)
    #   MR_TEST_BACKEND_IMAGE=maproulette-backend:local npm run test:e2e
    # The team-ownership specs (team-detail, team-membership, challenge-teams,
    # challenge-managers) need this: every one of their endpoints lives on the
    # unmerged collin/team-images branch and 404s against the published image.
    image: ${MR_TEST_BACKEND_IMAGE:-ghcr.io/maproulette/maproulette-backend:main}
    platform: linux/amd64 # TODO: remove once the image above supports multi-arch
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      MR_DATABASE_URL: jdbc:postgresql://db:5432/maproulette
      MR_DATABASE_USERNAME: maproulette
      MR_DATABASE_PASSWORD: hunter2
      # Also the key Play signs session cookies with, so e2e/fixtures.ts signs
      # its own with it to log in as seeded users. API keys, which the harness
      # used before, were removed from the backend in 7a8cdb17.
      APPLICATION_SECRET: test-application-secret-at-least-32-chars
      MAPROULETTE_SECRET_KEY: test-maproulette-secret-key-at-least-32-chars
      # The OSM id of the harness's super user (SUPER_USER_OSM_ID in
      # e2e/fixtures.ts). The backend only promotes it at boot, so global setup
      # seeds the user and then restarts the backend once.
      MR_SUPER_ACCOUNTS: "800000000"
      # OAuth values are required for the backend to boot but are not used
      # (the harness signs its own session cookies; see e2e/fixtures.ts)
      MR_OSM_SERVER: https://master.apis.dev.openstreetmap.org
      MR_OAUTH_CONSUMER_KEY: not_a_real_key
      MR_OAUTH_CONSUMER_SECRET: not_a_real_secret
    ports:
      # Overridable so the stack can run beside a local development backend
      # already holding 9000: set E2E_BACKEND_PORT to match .env.test.local.
      - "${E2E_BACKEND_PORT:-9000}:80"
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/api/v2/service/info || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
