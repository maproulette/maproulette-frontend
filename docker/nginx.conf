server {
  listen 80;
  charset utf-8;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;

  root /srv/www;

  # The app shell and runtime config must never be cached, so config changes and
  # new deploys take effect immediately. Hashed assets remain cacheable.
  location = /index.html {
    add_header Cache-Control "no-store";
  }
  location = /env.json {
    add_header Cache-Control "no-store";
  }

  # Assets are immutable (the build step puts their hash into their filename).
  # We don't want to fall back to index.html here; it would confuse TanStack
  # Router if it tries to fetch a missing chunk (e.g. after a deploy).
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
